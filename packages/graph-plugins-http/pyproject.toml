[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphflow-plugins-http"
version = "1.0.0"
description = "HTTP client and web utilities plugin for GraphFlow"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "GraphFlow Contributors"}
]
keywords = ["graphflow", "http", "api", "web", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

# Note: graphflow-core must be installed separately (pip install -e packages/graph-core)

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/graphflow"
Documentation = "https://github.com/your-org/graphflow/tree/main/packages/graph-plugins-http"
Repository = "https://github.com/your-org/graphflow"

[project.entry-points."graphflow.plugins"]
http = "graphflow_http"

[tool.setuptools.packages.find]
where = ["."]
include = ["graphflow_http*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
