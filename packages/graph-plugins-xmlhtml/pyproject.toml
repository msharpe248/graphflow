[project]
name = "graphflow-xmlhtml"
version = "1.0.0"
description = "GraphFlow XML & HTML Plugin - XML parsing and HTML manipulation utilities"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "graphflow-core",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "markdownify>=0.11.0",
    "xmltodict>=0.13.0",
    "bleach>=6.0.0",
]

[project.entry-points."graphflow.plugins"]
xmlhtml = "graphflow_xmlhtml"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["graphflow_xmlhtml*"]
