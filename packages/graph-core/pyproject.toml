[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphflow-core"
version = "0.1.0"
description = "Core library for GraphFlow agent builder"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "GraphFlow Contributors"}
]
dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["graphflow_core*"]

[tool.setuptools.package-data]
graphflow_core = ["steps/templates/**/*.jinja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
