[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphflow-plugins-encoding"
version = "1.0.0"
description = "Data encoding, hashing, and compression plugin for GraphFlow"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "GraphFlow Contributors"}
]
keywords = ["graphflow", "encoding", "base64", "hash", "compression", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = []

# Note: graphflow-core must be installed separately (pip install -e packages/graph-core)

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/graphflow"
Documentation = "https://github.com/your-org/graphflow/tree/main/packages/graph-plugins-encoding"
Repository = "https://github.com/your-org/graphflow"

[project.entry-points."graphflow.plugins"]
encoding = "graphflow_encoding"

[tool.setuptools.packages.find]
where = ["."]
include = ["graphflow_encoding*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
