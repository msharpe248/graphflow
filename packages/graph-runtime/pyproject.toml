[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphflow-runtime"
version = "0.1.0"
description = "Runtime manager for GraphFlow agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "GraphFlow Contributors"}
]
dependencies = [
    "graphflow-core>=0.1.0",
    "graphflow-compiler>=0.1.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",  # For testing FastAPI
]

[project.scripts]
graphflow-runtime = "graphflow_runtime.main:main"

[tool.setuptools.packages.find]
include = ["graphflow_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
