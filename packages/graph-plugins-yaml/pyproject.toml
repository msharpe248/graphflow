[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphflow-plugins-yaml"
version = "1.0.0"
description = "YAML manipulation plugin for GraphFlow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.entry-points."graphflow.plugins"]
yaml = "graphflow_yaml"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["graphflow_yaml*"]
