[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests (require external services)
    compilation: tests for graph compilation
    standalone: tests for standalone agent execution
    runtime: tests for multi-graph runtime
    unit: marks tests as unit tests

# Timeouts (if pytest-timeout is installed)
timeout = 300

# Coverage (if pytest-cov is installed)
[coverage:run]
source =
    graphflow_core
    graphflow_compiler
    graphflow_runtime

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
